name: family-travel
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: https://${TRAVEL_DOMAIN:-travel.lovenom.eu.org}
      TRUST_PROXY: '1'
      DATA_DIR: /app/data
    volumes:
      - votes:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      TRAVEL_DOMAIN: ${TRAVEL_DOMAIN:-travel.lovenom.eu.org}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  votes:
  caddy_data:
  caddy_config:
networks:
  backend:
