# Add inside the EXISTING HTTPS server {} block. Keep its certificate settings.
# The app is started with BASE_PATH=/family-trip and APP_PORT=3100.
location = /family-trip {
    return 308 /family-trip/$is_args$args;
}

location ^~ /family-trip/ {
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:3100;
    # No trailing slash on proxy_pass: retain /family-trip/ in the upstream request.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
